[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-ceramic"
version = "0.1.1"
description = "llama-index tools ceramic integration"
authors = [{ name = "Ceramic AI", email = "support@ceramic.ai" }]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = "MIT"
dependencies = [
    "ceramic_ai>=0.1.0",
    "llama-index-core>=0.12.0,<0.15",
]

[dependency-groups]
dev = [
    "llama-index-llms-openai>=0.1.0",
    "pytest>=7.2.1",
    "pytest-mock>=3.11.1",
    "ruff>=0.11.0",
]

[tool.hatch.build.targets.sdist]
include = ["llama_index/"]
exclude = ["**/BUILD"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]
exclude = ["**/BUILD"]

[tool.llamahub]
contains_example = true
import_path = "llama_index.tools.ceramic"

[tool.llamahub.class_authors]
CeramicToolSpec = "ceramic-ai"

[tool.ruff]
line-length = 88
